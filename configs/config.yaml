# =============================================================================
# Configuration file for the Industrial Defect Detection project
# All paths, hyperparameters, and run settings live here — nothing should be
# hardcoded inside src/ or scripts/. Override any value from the CLI scripts
# using --config path/to/other_config.yaml, or by editing this file directly.
# =============================================================================

# ---------------------------------------------------------------------------
# Dataset settings
# ---------------------------------------------------------------------------
dataset:
  # Root folder that contains one subfolder per MVTec category
  # (e.g. data/mvtec_anomaly_detection/bottle/, .../carpet/, ...)
  root_path: "data/mvtec_anomaly_detection"

  # Categories to use. Leave empty ([]) to auto-detect every category
  # folder present under root_path.
  selected_categories: []

  # Standard MVTec AD split subfolder names — do not change unless your
  # dataset copy uses a non-standard layout.
  train_subdir: "train/good"
  test_subdir: "test"
  ground_truth_subdir: "ground_truth"

# ---------------------------------------------------------------------------
# Preprocessing / image settings
# ---------------------------------------------------------------------------
preprocessing:
  image_size: 224          # images are resized to (image_size x image_size)
  # ImageNet normalization statistics (required for ImageNet-pretrained backbones)
  normalize_mean: [0.485, 0.456, 0.406]
  normalize_std: [0.229, 0.224, 0.225]

# ---------------------------------------------------------------------------
# Model / backbone settings
# ---------------------------------------------------------------------------
model:
  # "resnet18" = fast/demo mode, "resnet50" = full mode (slower, stronger features)
  backbone: "resnet18"
  # Which backbone layers to extract patch features from.
  # Mid-level layers balance spatial resolution and semantic richness.
  feature_layers: ["layer2", "layer3"]
  # Device: "auto" picks cuda if available, else cpu
  device: "auto"

# ---------------------------------------------------------------------------
# Memory bank / anomaly detection settings
# ---------------------------------------------------------------------------
memory_bank:
  # Coreset subsampling ratio (0-1). 1.0 keeps every patch embedding
  # (accurate but memory-heavy); lower values trade accuracy for speed/RAM.
  coreset_ratio: 0.10
  # "random" (fast, default — good for demo mode) or "greedy_kcenter"
  # (slower, better coverage of the embedding space — better suited to
  # full mode with a smaller resulting coreset size).
  coreset_method: "random"
  # Number of nearest neighbours used when scoring a test patch
  k_nearest_neighbors: 5
  random_seed: 42

# ---------------------------------------------------------------------------
# Thresholding
# ---------------------------------------------------------------------------
threshold:
  # "youden_j" (ROC-based, maximizes TPR - FPR) or "percentile" (fixed
  # percentile of the normal-image training scores)
  method: "youden_j"
  fallback_percentile: 99.0
  # How per-image anomaly score is aggregated from the patch-level score map.
  # "max": single worst patch determines the image score (standard PatchCore
  #   choice — one strongly anomalous region is enough to flag the image).
  # "topk_mean": mean of the top-k worst patches — slightly more robust to
  #   single-pixel noise, at the cost of diluting very small defects.
  aggregation: "max"
  topk_mean_k: 10  # only used when aggregation == "topk_mean"

# ---------------------------------------------------------------------------
# Data loading
# ---------------------------------------------------------------------------
dataloader:
  batch_size: 8
  # 0 = load data in the main process (no multiprocessing). Safer default —
  # avoids platform-specific DataLoader worker pickling issues (notably on
  # macOS with recent Python versions). Raise to 2-4 if you want a speed
  # boost and don't hit any multiprocessing errors on your machine.
  num_workers: 0

# ---------------------------------------------------------------------------
# Output locations
# ---------------------------------------------------------------------------
output:
  models_dir: "models"
  results_dir: "results"
  plots_dir: "results/plots"
  predictions_dir: "results/predictions"
  metrics_dir: "results/metrics"

# ---------------------------------------------------------------------------
# Run mode
# ---------------------------------------------------------------------------
mode: "demo"   # "demo" (small/fast) or "full" (all categories, resnet50)
